<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

SHGT Gallery

</title>

<link rel="icon"
href="images/favicon.png">

<link rel="stylesheet"
href="css/style.css">

</head>

<body>

<!--==================================================
HEADER
===================================================-->

<header class="header">

<div class="logo-area">

<a href="index.html">

<img
src="images/logo.png"
alt="SHGT Logo">

</a>

<h2>

SH Global Technology

</h2>

</div>

<nav>

<a href="index.html">
Home
</a>

<a href="products.html">
Products
</a>

<a href="gallery.html">
Gallery
</a>

<a href="catalogue.html">
Catalogue
</a>

<a href="services.html">
Services
</a>

<a href="contact.html">
Contact
</a>

</nav>

</header>

<!--==================================================
MAIN CONTAINER START
===================================================-->

<main class="gallery-container">

<h1 class="gallery-title">

Machine & Spare Parts Gallery

</h1>
<!--==================================================
SEARCH + FILTER
===================================================-->

<div class="gallery-toolbar">

<input
type="text"
id="gallerySearch"
placeholder="Search Machines & Spare Parts...">

<div class="gallery-filters">

<button
class="gallery-filter"
data-type="all">

All

</button>

<button
class="gallery-filter"
data-type="machine">

Machines

</button>

<button
class="gallery-filter"
data-type="spare">

Spare Parts

</button>

</div>

</div>


<!--==================================================
LOADING
===================================================-->

<p id="loadingText">

Loading Gallery...

</p>


<!--==================================================
GALLERY GRID
===================================================-->

<div
id="galleryContainer"
class="gallery-grid">

</div>
<!--==================================================
LIGHTBOX
===================================================-->

<div id="galleryLightbox">

<img
id="lightboxImage"
src=""
alt="Gallery Preview">

</div>


<!--==================================================
END MAIN
===================================================-->

</main>


<!--==================================================
FOOTER
===================================================-->

<footer class="footer">

<p>

© 2026 SH Global Technology
All Rights Reserved.

</p>

</footer>


<!--==================================================
JAVASCRIPT
===================================================-->

<script src="js/script.js"></script>

<script
type="module"
src="js/gallery.js">
</script>
</body>

</html>
