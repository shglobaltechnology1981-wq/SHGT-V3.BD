<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>

SH GLOBAL TECHNOLOGY
Purchase Entry

</title>



<link
rel="stylesheet"
href="../../css/style.css">

<link
rel="stylesheet"
href="purchase.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">



</head>

<body>



<!--==================================================
HEADER
===================================================-->

<header class="top-header">

<div class="logo">

<h2>

SH GLOBAL TECHNOLOGY

</h2>

<p>

Purchase Management System

</p>

</div>



<div class="header-right">

<a
href="../dashboard.html"
class="btn-home">

<i class="fa-solid fa-house"></i>

Dashboard

</a>

</div>

</header>



<!--==================================================
MAIN CONTAINER
===================================================-->

<div class="purchase-container">



<!--==================================================
PURCHASE TITLE
===================================================-->

<div class="page-title">

<h2>

<i class="fa-solid fa-cart-shopping"></i>

Purchase Entry

</h2>

<p>

Purchase Management • Supplier • Stock Update

</p>

</div>



<!--==================================================
PURCHASE FORM
===================================================-->

<form
id="purchaseForm">



<div class="form-grid">



<!-- PURCHASE NO -->

<div class="form-group">

<label>

Purchase No

</label>

<input
type="text"
id="purchaseNo"
readonly>

</div>



<!-- DATE -->

<div class="form-group">

<label>

Purchase Date

</label>

<input
type="date"
id="purchaseDate"
required>

</div>



<!-- SUPPLIER -->

<div class="form-group">

<label>

Supplier

</label>

<select
id="supplier"
required>

<option value="">

Select Supplier

</option>

</select>

</div>



<!-- INVOICE -->

<div class="form-group">

<label>

Invoice No

</label>

<input
type="text"
id="invoiceNo"
placeholder="Invoice Number">

</div>



<!-- REMARKS -->

<div class="form-group full-width">

<label>

Remarks

</label>

<textarea

id="remarks"

rows="3"

placeholder="Purchase Remarks">

</textarea>

</div>



</div>


  <!--==================================================
PURCHASE ITEM TABLE
===================================================-->

<div class="table-section">

<h3>

<i class="fa-solid fa-box"></i>

Purchase Item List

</h3>



<table id="purchaseTable">

<thead>

<tr>

<th width="5%">SL</th>

<th width="30%">Product Name</th>

<th width="12%">Unit</th>

<th width="10%">Qty</th>

<th width="12%">Purchase Price</th>

<th width="12%">Total</th>

<th width="8%">Action</th>

</tr>

</thead>



<tbody id="purchaseBody">

<tr>

<td>

1

</td>

<td>

<input

type="text"

class="productName"

placeholder="Product Name"

required>

</td>

<td>

<select class="unit">

<option>PCS</option>

<option>SET</option>

<option>BOX</option>

<option>ROLL</option>

<option>KG</option>

<option>METER</option>

</select>

</td>

<td>

<input

type="number"

class="qty"

min="1"

value="1"

required>

</td>

<td>

<input

type="number"

class="price"

min="0"

step="0.01"

value="0"

required>

</td>

<td>

<input

type="number"

class="total"

value="0"

readonly>

</td>

<td>

<button

type="button"

class="removeRow">

<i class="fa-solid fa-trash"></i>

</button>

</td>

</tr>

</tbody>

</table>



<div class="table-action">

<button

type="button"

id="addRow">

<i class="fa-solid fa-plus"></i>

Add Item

</button>

</div>

</div>



<!--==================================================
PURCHASE SUMMARY
===================================================-->

<div class="summary-box">

<div class="summary-row">

<label>

Sub Total

</label>

<input

type="number"

id="subTotal"

value="0"

readonly>

</div>



<div class="summary-row">

<label>

Discount

</label>

<input

type="number"

id="discount"

value="0">

</div>



<div class="summary-row">

<label>

Transport Cost

</label>

<input

type="number"

id="transport"

value="0">

</div>



<div class="summary-row grand-total">

<label>

Grand Total

</label>

<input

type="number"

id="grandTotal"

value="0"

readonly>

</div>

</div>

  <!--==================================================
PAYMENT INFORMATION
===================================================-->

<div class="payment-section">

<h3>

<i class="fa-solid fa-money-bill-wave"></i>

Payment Information

</h3>



<div class="form-grid">



<!-- PAYMENT METHOD -->

<div class="form-group">

<label>

Payment Method

</label>

<select id="paymentMethod">

<option value="Cash">Cash</option>

<option value="Bank">Bank</option>

<option value="Cheque">Cheque</option>

<option value="Mobile Banking">Mobile Banking</option>

<option value="Credit">Credit</option>

</select>

</div>



<!-- PAID AMOUNT -->

<div class="form-group">

<label>

Paid Amount

</label>

<input

type="number"

id="paidAmount"

value="0"

min="0"

step="0.01">

</div>



<!-- DUE AMOUNT -->

<div class="form-group">

<label>

Due Amount

</label>

<input

type="number"

id="dueAmount"

value="0"

readonly>

</div>



<!-- PURCHASE STATUS -->

<div class="form-group">

<label>

Status

</label>

<select id="purchaseStatus">

<option value="Paid">

Paid

</option>

<option value="Partial">

Partial Paid

</option>

<option value="Due">

Due

</option>

</select>

</div>



</div>

</div>



<!--==================================================
ACTION BUTTONS
===================================================-->

<div class="action-buttons">

<button

type="submit"

id="savePurchase"

class="btn btn-success">

<i class="fa-solid fa-floppy-disk"></i>

Save Purchase

</button>



<button

type="reset"

id="resetPurchase"

class="btn btn-warning">

<i class="fa-solid fa-rotate"></i>

Reset

</button>



<button

type="button"

id="printPurchase"

class="btn btn-primary">

<i class="fa-solid fa-print"></i>

Print

</button>



<a

href="purchase-report.html"

class="btn btn-info">

<i class="fa-solid fa-file-lines"></i>

Purchase Report

</a>



<a

href="../dashboard.html"

class="btn btn-dark">

<i class="fa-solid fa-house"></i>

Dashboard

</a>

</div>



</form>



<!--==================================================
PURCHASE ENTRY END
===================================================-->



<script type="module" src="purchase.js"></script>

</body>

</html>
