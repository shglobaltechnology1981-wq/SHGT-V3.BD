<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SH Global Technology | Products</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>



<!-- HEADER START -->

<header>


<div class="logo-area">

<img src="images/logo.png" alt="SH Global Technology">

<h2>SH Global Technology</h2>

</div>



<nav>

<a href="index.html">Home</a>

<a href="products.html">Products</a>

<a href="gallery.html">Gallery</a>

<a href="catalogue.html">Catalogue</a>

<a href="services.html">Our Services</a>

<a href="index.html#brands">Brands We Supply</a>

<a href="contact.html">Contact</a>

</nav>


</header>


<!-- HEADER END -->





<!-- PRODUCTS PAGE START -->


<section class="products">


<h2>Our Products</h2>


<p style="text-align:center;">

Industrial Sewing Machine, Spare Parts and Garment Automation Solutions

</p>



<div class="product-box" id="product-list">


<!-- Product Will Load Here -->


</div>


</section>



<!-- PRODUCTS PAGE END -->


<!-- PRODUCT SCRIPT START -->

<script type="module">

import { initializeApp } from 
"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import { 
getFirestore,
collection,
getDocs
} from 
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";



const firebaseConfig = {

apiKey: "YOUR_API_KEY",

authDomain: "YOUR_AUTH_DOMAIN",

projectId: "YOUR_PROJECT_ID",

storageBucket: "YOUR_STORAGE_BUCKET",

messagingSenderId: "YOUR_SENDER_ID",

appId: "YOUR_APP_ID"

};



const app = initializeApp(firebaseConfig);


const db = getFirestore(app);



const productList = document.getElementById("product-list");



async function loadProducts(){


try{


const querySnapshot = await getDocs(collection(db,"products"));



querySnapshot.forEach((doc)=>{


let product = doc.data();



productList.innerHTML += `


<div class="card">


<img src="${product.image}" 
style="width:100%;height:200px;object-fit:contain;">



<h3>${product.name}</h3>


<p>
Brand: ${product.brand}
</p>



<a href="product.html?id=${doc.id}" 
class="whatsapp-btn">

View Details

</a>


</div>



`;



});



}

catch(error){

console.log("Product Loading Error",error);

}



}



loadProducts();



</script>


<!-- PRODUCT SCRIPT END -->


<script src="js/script.js"></script>


</body>

</html>
