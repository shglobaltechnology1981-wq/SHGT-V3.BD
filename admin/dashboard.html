
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHGT Admin Dashboard</title>

<link rel="stylesheet" href="../css/style.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
}

.header{
background:#0b3d91;
color:#fff;
padding:15px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

.header h2{
font-size:24px;
}

.logout-btn{
background:#e53935;
color:#fff;
padding:10px 18px;
border:none;
border-radius:6px;
cursor:pointer;
text-decoration:none;
font-weight:bold;
}

.container{
display:flex;
min-height:100vh;
}

.sidebar{
width:250px;
background:#092c6c;
padding-top:20px;
}

.sidebar a{
display:block;
padding:15px 20px;
color:#fff;
text-decoration:none;
border-bottom:1px solid rgba(255,255,255,.08);
transition:.3s;
}

.sidebar a:hover{
background:#0b3d91;
}

.main{
flex:1;
padding:30px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:#fff;
padding:25px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
text-align:center;
}

.card h3{
color:#666;
margin-bottom:10px;
}

.card h1{
font-size:34px;
color:#0b3d91;
}

.section-title{
margin:20px 0;
color:#0b3d91;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

table th,
table td{
padding:12px;
border:1px solid #ddd;
text-align:left;
}

table th{
background:#0b3d91;
color:#fff;
}

.action-btn{
padding:6px 12px;
border:none;
border-radius:5px;
cursor:pointer;
font-size:14px;
margin-right:5px;
}

.edit-btn{
background:#28a745;
color:#fff;
}

.delete-btn{
background:#dc3545;
color:#fff;
}

</style>

</head>

<body>

<div class="header">

<h2>SH Global Technology Admin Dashboard</h2>

<a href="login.html" class="logout-btn">Logout</a>

</div>

<div class="container">

<div class="sidebar">

<a href="dashboard.html">🏠 Dashboard</a>

<a href="upload.html">➕ Add Product</a>

<a href="products.html">📦 Products</a>

<a href="spare-parts.html">🔧 Spare Parts</a>

<a href="../index.html">🌐 Visit Website</a>

</div>

<div class="main">

<div class="cards">

<div class="card">

<h3>Total Products</h3>

<h1 id="totalProducts">0</h1>

</div>

<div class="card">

<h3>Total Brands</h3>

<h1 id="totalBrands">0</h1>

</div>

<div class="card">

<h3>Total Categories</h3>

<h1 id="totalCategories">0</h1>

</div>

<div class="card">

<h3>Total Images</h3>

<h1 id="totalImages">0</h1>

</div>

</div>

<h2 class="section-title">

Latest Products

</h2>

<table>

<thead>

<tr>

<th>Name</th>

<th>Brand</th>

<th>Category</th>

<th>Action</th>

</tr>

</thead>

<tbody id="productTable">

</tbody>

</table>

</div>

</div>

<script type="module" src="dashboard.js"></script>

</body>
</html>
