<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHGT Spare Parts Upload</title>

<link rel="icon" href="../images/logo.png">

<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>


<body>


<div class="upload-container">


<div class="upload-box">


<h2>
<i class="fas fa-cogs"></i>

Add Spare Parts

</h2>



<form id="partsForm">



<label>Part Name</label>

<input
type="text"
id="partName"
placeholder="Spare Parts Name"
required>



<label>Brand</label>

<select id="partBrand">

<option>JUKI</option>

<option>Brother</option>

<option>Pegasus</option>

<option>Jack</option>

<option>Siruba</option>

<option>Yamato</option>

<option>Typical</option>

<option>Kansai Special</option>

<option>Zoje</option>

<option>SHGT</option>

</select>



<label>Category</label>

<input
type="text"
id="partCategory"
placeholder="Needle / Hook / Motor / PCB"
required>



<label>Model</label>

<input
type="text"
id="partModel"
placeholder="Machine Model">



<label>Part Number</label>

<input
type="text"
id="partNumber"
placeholder="Original Part Number">



<label>Price</label>

<input
type="text"
id="partPrice"
value="Contact for Price">



<label>Description</label>

<textarea
id="partDescription"
placeholder="Spare Parts Description">
</textarea>



<label>Part Image</label>

<input
type="file"
id="partImage"
accept="image/*"
required>



<div id="partPreview"></div>



<button
type="submit"
class="btn btn-primary">

<i class="fas fa-save"></i>

Save Spare Part

</button>



</form>



<div id="partMessage"></div>



</div>


</div>



<script type="module" src="spare-parts-upload.js"></script>


</body>

</html>
