<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>

SH GLOBAL TECHNOLOGY
Purchase Entry

</title>



<link
rel="stylesheet"
href="../../css/style.css">

<link
rel="stylesheet"
href="purchase.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">



</head>

<body>



<!--==================================================
HEADER
===================================================-->

<header class="top-header">

<div class="logo">

<h2>

SH GLOBAL TECHNOLOGY

</h2>

<p>

Purchase Management System

</p>

</div>



<div class="header-right">

<a
href="../dashboard.html"
class="btn-home">

<i class="fa-solid fa-house"></i>

Dashboard

</a>

</div>

</header>



<!--==================================================
MAIN CONTAINER
===================================================-->

<div class="purchase-container">



<!--==================================================
PURCHASE TITLE
===================================================-->

<div class="page-title">

<h2>

<i class="fa-solid fa-cart-shopping"></i>

Purchase Entry

</h2>

<p>

Purchase Management • Supplier • Stock Update

</p>

</div>



<!--==================================================
PURCHASE FORM
===================================================-->

<form
id="purchaseForm">



<div class="form-grid">



<!-- PURCHASE NO -->

<div class="form-group">

<label>

Purchase No

</label>

<input
type="text"
id="purchaseNo"
readonly>

</div>



<!-- DATE -->

<div class="form-group">

<label>

Purchase Date

</label>

<input
type="date"
id="purchaseDate"
required>

</div>



<!-- SUPPLIER -->

<div class="form-group">

<label>

Supplier

</label>

<select
id="supplier"
required>

<option value="">

Select Supplier

</option>

</select>

</div>



<!-- INVOICE -->

<div class="form-group">

<label>

Invoice No

</label>

<input
type="text"
id="invoiceNo"
placeholder="Invoice Number">

</div>



<!-- REMARKS -->

<div class="form-group full-width">

<label>

Remarks

</label>

<textarea

id="remarks"

rows="3"

placeholder="Purchase Remarks">

</textarea>

</div>



</div>
