<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHGT Product Upload</title>

<link rel="icon" href="../images/logo.png">

<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>


<body>


<div class="upload-container">


<div class="upload-box">


<h2>

<i class="fas fa-upload"></i>

Add New Product

</h2>


<form id="productForm">


<label>Product Name</label>

<input 
type="text"
id="name"
placeholder="Product Name"
required>


<label>Brand</label>

<select id="brand">

<option>JUKI</option>

<option>Brother</option>

<option>Pegasus</option>

<option>Jack</option>

<option>Siruba</option>

<option>Yamato</option>

<option>Typical</option>

<option>Kansai Special</option>

<option>Zoje</option>

</select>


<label>Category</label>

<input 
type="text"
id="category"
placeholder="Category"
required>


<label>Model</label>

<input 
type="text"
id="model"
placeholder="Model Number"
required>


<label>Price</label>

<input 
type="text"
id="price"
value="Contact for Price">


<label>Description</label>

<textarea 
id="description"
placeholder="Product Description">
</textarea>


<label>Product Image</label>

<input 
type="file"
id="image"
accept="image/*"
required>


<div id="preview"></div>


<button 
type="submit"
class="btn btn-primary">

<i class="fas fa-save"></i>

Save Product

</button>


</form>


<div id="message"></div>


</div>


</div>


<script type="module" src="upload.js"></script>


</body>

</html>
