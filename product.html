<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Details | SH Global Technology</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<div class="logo-area">

<img src="images/logo.png">

<h2>SH Global Technology</h2>

</div>


<nav>

<a href="index.html">Home</a>

<a href="products.html">Products</a>

<a href="index.html#brands">Brands</a>

<a href="index.html#contact">Contact</a>

</nav>


</header>



<section class="products">


<div id="product-details" class="card">

<h2>Loading Product...</h2>

</div>


</section>



<script>


let params = new URLSearchParams(window.location.search);

let productId = params.get("id");



fetch("data/products.json")


.then(response => response.json())


.then(products => {


let product = products.find(item => item.id === productId);



if(product){


document.getElementById("product-details").innerHTML = `


<img src="${product.image}"
style="width:100%;height:350px;object-fit:contain;">



<h2>${product.name}</h2>



<h3>
Brand: ${product.brand}
</h3>



<p>
Category: ${product.category}
</p>



<p>
${product.description}
</p>



<br>


<a class="whatsapp-btn"
href="https://wa.me/8801621007916?text=I need details about ${product.name}">


WhatsApp Inquiry


</a>


`;


}

else{


document.getElementById("product-details").innerHTML =

"<h2>Product Not Found</h2>";

}


})


.catch(error=>{


document.getElementById("product-details").innerHTML =

"<h2>Loading Error</h2>";


});



<script src="js/script.js"></script>

<script type="module" src="js/product-details.js"></script>


</body>

</html>
