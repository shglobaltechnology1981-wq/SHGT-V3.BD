<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SH Global Technology | Product Details</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<!-- HEADER START -->

<header>


<div class="logo-area">

<img src="images/logo.png">

<h2>SH Global Technology</h2>

</div>



<nav>

<a href="index.html">Home</a>

<a href="products.html">Products</a>

<a href="gallery.html">Gallery</a>

<a href="catalogue.html">Catalogue</a>

<a href="services.html">Our Services</a>

<a href="contact.html">Contact</a>

</nav>


</header>


<!-- HEADER END -->





<!-- PRODUCT DETAILS START -->


<section class="product-details">


<div id="product-view">


<h2>Loading Product...</h2>


</div>


</section>



<!-- PRODUCT DETAILS END -->





<script type="module">


import { initializeApp } from 
"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {

getFirestore,
doc,
getDoc

} from 
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";



const firebaseConfig = {

apiKey: "YOUR_API_KEY",

authDomain: "YOUR_AUTH_DOMAIN",

projectId: "YOUR_PROJECT_ID",

storageBucket: "YOUR_STORAGE_BUCKET",

messagingSenderId: "YOUR_SENDER_ID",

appId: "YOUR_APP_ID"

};



const app = initializeApp(firebaseConfig);


const db = getFirestore(app);



const params = new URLSearchParams(window.location.search);


const id = params.get("id");



const productView = document.getElementById("product-view");



async function loadProduct(){


const productRef = doc(db,"products",id);


const productSnap = await getDoc(productRef);



if(productSnap.exists()){


let product = productSnap.data();



productView.innerHTML = `


<img src="${product.image}" 
style="width:350px;height:350px;object-fit:contain;">


<h2>${product.name}</h2>


<h3>Brand: ${product.brand}</h3>


<p>${product.description || "Industrial Sewing Machine Solution"}</p>



<a class="whatsapp-btn"
href="https://wa.me/8801621007916?text=I need information about ${product.name}">

Inquiry on WhatsApp

</a>


`;



}

else{


productView.innerHTML="<h2>Product Not Found</h2>";

}


}



loadProduct();


</script>



</body>

</html>
